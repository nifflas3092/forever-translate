# Builds ForeverTranslate.exe (and the addon zip) on GitHub's own Windows
# machines whenever a version tag like v0.1.0 is pushed, and attaches them,
# with SHA-256 checksums, to that GitHub release.
name: Build release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write   # only needed to attach files to the release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt pyinstaller==6.22.3

      - name: Build ForeverTranslate.exe
        run: >
          pyinstaller --onefile --windowed --noconfirm
          --name ForeverTranslate
          --icon app/assets/icon.ico
          --add-data "app/assets;assets"
          app/forever_translate.py

      - name: Package the addon
        shell: pwsh
        run: Compress-Archive -Path addon/ForeverTranslate -DestinationPath dist/ForeverTranslate-addon.zip

      - name: Checksums
        shell: pwsh
        run: |
          $files = @(Get-ChildItem dist -File)
          $lines = $files | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          }
          $lines | Out-File -Encoding ascii dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ForeverTranslate
          path: dist/*

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ForeverTranslate.exe
            dist/ForeverTranslate-addon.zip
            dist/SHA256SUMS.txt
